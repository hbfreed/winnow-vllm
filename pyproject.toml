[project]
name = "moe-winnow-vllm"
version = "0.1.0"
description = "vLLM serving plugin for Winnow MoE checkpoints"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Henry Freed" }]
license-files = ["LICENSE"]
dependencies = [
    "moe-winnow[fast]>=0.1,<0.2",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "vllm==0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.entry-points."vllm.general_plugins"]
winnow = "winnow_vllm:register"

[project.urls]
Repository = "https://github.com/hbfreed/winnow-vllm"
Issues = "https://github.com/hbfreed/winnow-vllm/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnow_vllm"]

[tool.uv.sources]
moe-winnow = { git = "https://github.com/hbfreed/winnow.git", rev = "73a6f6164fc8ae38fef651a9e2c5d6b0262ffcea" }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
